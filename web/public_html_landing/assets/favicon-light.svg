<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  SIGNula.id — Favicon glyph (light-chrome variant, static)
  ============================================================================
  A simplified derivative of the full symbol, purpose-built for tiny sizes
  (browser tabs, bookmarks, 16-48px): a bold gradient badge with a large
  keyhole cut-out (the "lock" half of the mark) plus a small checkmark badge
  (the "verified" half). The fine key-teeth detail from the full symbol does
  not survive down to 16px, so it is intentionally dropped here — see
  symbol-*.svg for the full animated mark used at logo scale.

  No animation (a static glyph is the reliable choice for a tab icon, which
  many browsers snapshot/cache as a bitmap). Colours are plain hex (not CSS
  custom properties) so this file also rasterises correctly with common SVG
  tools when producing favicon.ico / PNG fallbacks.
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="sig-fav-l-title">
  <title id="sig-fav-l-title">SIGNula.id</title>
  <defs>
    <linearGradient id="sigFavGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <mask id="sigFavHoleL" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect x="2" y="2" width="44" height="44" rx="12" fill="#ffffff"/>
      <circle cx="22" cy="19" r="7.5" fill="#000000"/>
      <path d="M 15.5 21 L 28.5 21 L 24 35 L 20 35 Z" fill="#000000"/>
    </mask>
  </defs>
  <g id="lock">
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#sigFavGradL)" mask="url(#sigFavHoleL)"/>
  </g>
  <g id="check">
    <circle cx="36" cy="36" r="9" fill="#ffffff" stroke="#5568d3" stroke-width="1.4"/>
    <path d="M 31.7 36 L 34.6 39 L 40.6 32" fill="none" stroke="#764ba2" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
