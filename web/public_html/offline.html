<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SIGNula</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7fb;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .offline-container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        .shield-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
        }

        .shield-icon svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #007bff;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #343a40;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #6c757d;
            margin-bottom: 2rem;
        }

        .btn-retry {
            display: inline-block;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
        }

        .btn-retry:hover {
            background-color: #0056b3;
        }

        .btn-retry:active {
            transform: scale(0.97);
        }

        .wifi-indicator {
            display: inline-block;
            width: 48px;
            height: 48px;
            margin-bottom: 1rem;
            opacity: 0.35;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 2rem 1.25rem;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }

            h2 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <!-- SIGNula Shield Icon -->
        <div class="shield-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none">
                <path d="M50 5 L90 25 L90 55 C90 82 70 105 50 115 C30 105 10 82 10 55 L10 25 Z"
                      fill="#007bff" opacity="0.12" stroke="#007bff" stroke-width="3"/>
                <path d="M50 5 L90 25 L90 55 C90 82 70 105 50 115 C30 105 10 82 10 55 L10 25 Z"
                      fill="none" stroke="#007bff" stroke-width="3" stroke-linejoin="round"/>
                <text x="50" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
                      font-size="32" font-weight="700" fill="#007bff">S</text>
            </svg>
        </div>

        <h1>SIGNula</h1>

        <!-- Wi-Fi Off Indicator -->
        <div>
            <svg class="wifi-indicator" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="#6c757d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <circle cx="12" cy="20" r="1"/>
            </svg>
        </div>

        <h2>You're Offline</h2>
        <p>It looks like you've lost your internet connection. Please check your connection and try again.</p>

        <button class="btn-retry" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
