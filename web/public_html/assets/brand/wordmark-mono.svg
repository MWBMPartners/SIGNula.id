<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  SIGNula.id — Wordmark (mono / high-contrast / colour-blind-safe)
  ============================================================================
  Single-colour wordmark using `currentColor` throughout. The ".id" emphasis
  is carried by font-weight only (no colour difference), so meaning survives
  fully in greyscale, print, or any colour-vision deficiency.
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" role="img"
     aria-labelledby="sig-wm-m-title" color="#111111">
  <title id="sig-wm-m-title">SIGNula.id</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: currentColor; }
    .sig-wm-sign   { font-weight: 800; }
    .sig-wm-ula    { font-weight: 500; }
    .sig-wm-suffix { font-weight: 800; text-decoration: underline; }
  </style>
  <g id="wordmark">
    <text x="6" y="49" font-size="40" letter-spacing="-0.5">
      <tspan class="sig-wm-sign">SIGN</tspan><tspan class="sig-wm-ula">ula</tspan><tspan class="sig-wm-suffix">.id</tspan>
    </text>
  </g>
</svg>
