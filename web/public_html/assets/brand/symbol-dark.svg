<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  SIGNula.id — Brand Symbol (dark-surface variant, animated)
  ============================================================================
  Same key-into-lock-plus-checkmark mark as symbol-adaptive.svg, with the
  dark-mode palette pinned — use this where the surface behind the mark is
  always dark regardless of the visitor's OS theme (e.g. a navy hero panel
  that never switches to light). For a mark that follows the OS/browser
  theme automatically, use symbol-adaptive.svg instead.

  Alpha transparency: background is fully transparent; the lock's keyhole is
  a true cut-out (SVG mask), not just an opaque circle drawn on top.

  Motion respects `prefers-reduced-motion`; the named groups
  (<g id="key">, "lock", "check") make each part easy to isolate, hide, or
  recolour independently.
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-labelledby="sig-sym-d-title sig-sym-d-desc">
  <title id="sig-sym-d-title">SIGNula.id symbol (dark)</title>
  <desc id="sig-sym-d-desc">A horizontal key sliding into a lock, followed by a checkmark, representing secure verified identity.</desc>

  <defs>
    <linearGradient id="sigSymGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b93ee"/>
      <stop offset="100%" stop-color="#9b7bc4"/>
    </linearGradient>
    <mask id="sigKeyholeMaskD" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="60" y="18" width="28" height="64" rx="8" fill="#ffffff"/>
      <circle cx="70" cy="48" r="6" fill="#000000"/>
      <path d="M 64.5 49 L 75.5 49 L 72 63 L 68 63 Z" fill="#000000"/>
    </mask>
  </defs>

  <style>
    svg {
      --sig-ink:     #c7d0fc; /* light periwinkle line colour, reads on dark navy */
      --sig-surface: #101a33; /* near-background badge surface with a light ring */
      --sig-accent:  #b79bd6;
    }
    .sig-line         { fill: none; stroke: var(--sig-ink); stroke-linecap: round; }
    .sig-fill-ink     { fill: var(--sig-ink); }
    .sig-plate        { fill: url(#sigSymGradD); }
    .sig-badge-circle { fill: var(--sig-surface); stroke: var(--sig-ink); stroke-width: 1.5; }
    .sig-tick         { fill: none; stroke: var(--sig-accent); stroke-linecap: round; stroke-linejoin: round; }

    #key { animation: sigKeySlide 2.6s ease-in-out infinite; }
    @keyframes sigKeySlide {
      0%   { transform: translateX(-34px); }
      28%  { transform: translateX(-34px); }
      55%  { transform: translateX(0); }
      100% { transform: translateX(0); }
    }
    .sig-badge-circle { opacity: 1; animation: sigBadgeFade 2.6s ease-in-out infinite; }
    @keyframes sigBadgeFade {
      0% { opacity: 0; } 52% { opacity: 0; } 62% { opacity: 1; } 100% { opacity: 1; }
    }
    .sig-tick {
      stroke-dasharray: 1; stroke-dashoffset: 0;
      animation: sigCheckDraw 2.6s ease-in-out infinite;
    }
    @keyframes sigCheckDraw {
      0% { stroke-dashoffset: 1; } 58% { stroke-dashoffset: 1; } 82% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #key, .sig-badge-circle, .sig-tick { animation: none !important; }
      #key              { transform: translateX(0) !important; }
      .sig-badge-circle { opacity: 1 !important; }
      .sig-tick         { stroke-dashoffset: 0 !important; }
    }
  </style>

  <g id="key">
    <circle class="sig-line" cx="17" cy="50" r="9" stroke-width="6"/>
    <rect class="sig-fill-ink" x="26" y="47" width="34" height="7" rx="1.5"/>
    <rect class="sig-fill-ink" x="46" y="54" width="5" height="6"/>
    <rect class="sig-fill-ink" x="54" y="54" width="6" height="9"/>
  </g>

  <g id="lock">
    <rect class="sig-plate" x="60" y="18" width="28" height="64" rx="8" mask="url(#sigKeyholeMaskD)"/>
  </g>

  <g id="check">
    <circle class="sig-badge-circle" cx="80" cy="75" r="13"/>
    <path class="sig-tick" pathLength="1" d="M 73.5 75 L 78.5 80 L 88.5 67.5" stroke-width="4.5"/>
  </g>
</svg>
