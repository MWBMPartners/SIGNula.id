<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  SIGNula.id — Wordmark (dark-surface variant)
  ============================================================================
  Same text-based wordmark as wordmark-light.svg, palette flipped for use on
  dark surfaces. See wordmark-light.svg for the font-stack/outlining notes.
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" role="img"
     aria-labelledby="sig-wm-d-title">
  <title id="sig-wm-d-title">SIGNula.id</title>
  <style>
    svg { --sig-text: #eceaf6; --sig-accent: #b79bd6; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .sig-wm-sign   { fill: var(--sig-text);   font-weight: 800; }
    .sig-wm-ula    { fill: var(--sig-text);   font-weight: 500; }
    .sig-wm-suffix { fill: var(--sig-accent); font-weight: 800; }
  </style>
  <g id="wordmark">
    <text x="6" y="49" font-size="40" letter-spacing="-0.5">
      <tspan class="sig-wm-sign">SIGN</tspan><tspan class="sig-wm-ula">ula</tspan><tspan class="sig-wm-suffix">.id</tspan>
    </text>
  </g>
</svg>
