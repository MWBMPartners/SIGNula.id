# =============================================================================
# 🤖 Dependabot — version updates across the four-tier branch model
# -----------------------------------------------------------------------------
# SIGNula.id ships through four long-lived branches:
#     alpha ▸ beta ▸ release-candidate ▸ main
#
# TWO complementary mechanisms keep every tier patched (see also
# .github/workflows/backport.yml and .github/workflows/dependabot-auto-label.yml):
#
#   1. VERSION updates (this file) — Dependabot opens routine version-bump PRs
#      DIRECTLY against each of the four branches via per-branch `target-branch`
#      entries. Each branch stays independently current.
#
#   2. SECURITY updates — GitHub raises Dependabot *security* update PRs ONLY
#      against the default branch (`main`); `target-branch` CANNOT redirect them
#      (documented platform limitation). To close that gap we:
#        a. auto-label those security PRs on `main` as `security`
#           (dependabot-auto-label.yml, via dependabot/fetch-metadata GHSA id), and
#        b. backport anything merged to `main` bearing `security`/`backport`
#           onto alpha/beta/release-candidate as cherry-pick PRs (backport.yml).
#      So a security fix that can only land on `main` still reaches every tier.
#
# ⚠️  Enabling Dependabot *security* updates + alerts also requires the repo's
#     Dependency graph to be turned ON in Settings ▸ Code security (owner action;
#     see PRE_LAUNCH_REVIEW.md). Version updates below work regardless.
#
# NOTE: self-hosted frontend libs (Bootstrap/jQuery/FontAwesome) are CDN-based /
# unmanifested today, so Dependabot cannot watch them yet (tracked: #101).
#
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-reference
# =============================================================================
version: 2

updates:
  # ===========================================================================
  # 🎼 Composer (PHP dev tooling: phpunit, phpstan, php_codesniffer, …)
  # ===========================================================================

  # --- main (default branch; NO target-branch → security updates stay ON) ---
  - package-ecosystem: "composer"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "composer", "branch:main"]
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)", include: "scope" }
    groups: { php-dev-tooling: { patterns: ["*"] } }

  # --- release-candidate (version updates) ---
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "release-candidate"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "composer", "branch:release-candidate"]
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)", include: "scope" }
    groups: { php-dev-tooling: { patterns: ["*"] } }

  # --- beta (version updates) ---
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "beta"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "composer", "branch:beta"]
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)", include: "scope" }
    groups: { php-dev-tooling: { patterns: ["*"] } }

  # --- alpha (version updates) ---
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "alpha"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "composer", "branch:alpha"]
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)", include: "scope" }
    groups: { php-dev-tooling: { patterns: ["*"] } }

  # ===========================================================================
  # ⚙️ GitHub Actions (keep workflow action pins current + patched)
  # ===========================================================================

  # --- main ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions", "branch:main"]
    commit-message: { prefix: "ci(deps)", include: "scope" }
    groups: { github-actions: { patterns: ["*"] } }

  # --- release-candidate ---
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release-candidate"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions", "branch:release-candidate"]
    commit-message: { prefix: "ci(deps)", include: "scope" }
    groups: { github-actions: { patterns: ["*"] } }

  # --- beta ---
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "beta"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions", "branch:beta"]
    commit-message: { prefix: "ci(deps)", include: "scope" }
    groups: { github-actions: { patterns: ["*"] } }

  # --- alpha ---
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "alpha"
    schedule: { interval: "weekly", day: "monday", time: "06:00", timezone: "Europe/London" }
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions", "branch:alpha"]
    commit-message: { prefix: "ci(deps)", include: "scope" }
    groups: { github-actions: { patterns: ["*"] } }
